spring:
  flyway:
    enabled: false
  application:
    name: dipalza
  profiles:
    active: dev-sec
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  tomcat:
    relaxed-query-chars: '|,{,},[,],^,`,<,>,",%'
  error:
    # Por defecto Spring Boot omite "message" del cuerpo JSON de error, así que
    # el motivo pasado a ResponseStatusException(status, "mensaje") nunca
    # llegaba a los clientes (mobile/web) -- solo veían el status y la frase
    # genérica del código HTTP.
    include-message: always
# logging común
logging:
  level:
    root: INFO
    org.springframework.security: INFO

