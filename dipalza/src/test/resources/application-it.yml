# Los *IT.java corren contra la BD real compartida con un ApplicationContext completo.
# Sin esto, @EnableScheduling dispara GeocodificacionRetryService.reintentarGeocodificacionPendiente()
# (initialDelay implicito = 0) apenas el contexto termina de levantar -- llamadas reales a
# Nominatim y UPDATEs reales sobre parada_vendedor como efecto colateral no declarado por
# ningun test. Ver SchedulingConfig para el @ConditionalOnProperty correspondiente.
app:
  scheduling:
    enabled: false
